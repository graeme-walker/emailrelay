# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

# Required
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"
  jobs:
    post_install:
      - pip install myst-parser
    pre_build:
      - libexec/make-sphinx --pre . doc

sphinx:
  configuration: doc/conf.py

